<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* 環節轉場動畫：蓋在畫面上約 3 秒（標題＋微動態插圖），自己淡出，不擋點擊。
   動畫用「負的 animation-delay」對齊伺服器時間，所以中途重新整理也會接在正確的進度。 */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;pointer-events:none}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
 background:radial-gradient(circle at 50% 42%,rgba(90,14,16,.92),rgba(24,6,8,.97));animation:gone 3s linear forwards}
@keyframes gone{0%{opacity:0}6%{opacity:1}72%{opacity:1}100%{opacity:0;visibility:hidden}}
.rays{position:absolute;width:150vmax;height:150vmax;opacity:.16;
 background:repeating-conic-gradient(from 0deg,#ffe9a8 0 6deg,transparent 6deg 18deg);animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.t{position:relative;font-family:'Noto Serif TC','PMingLiU',serif;font-size:clamp(25px,7.6vw,40px);white-space:nowrap;font-weight:900;letter-spacing:.22em;
 color:#ffe9a8;text-shadow:0 3px 0 #5c0f12,0 0 26px rgba(255,214,120,.75);animation:tin .9s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes tin{0%{opacity:0;transform:scale(.6) translateY(18px)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
.sub{position:relative;font-family:'Noto Serif TC','PMingLiU',serif;font-size:clamp(14px,3.9vw,17px);white-space:nowrap;letter-spacing:.14em;color:#f6d9a6;
 animation:fin 1.2s .35s both}
@keyframes fin{from{opacity:0}to{opacity:.95}}
svg{position:relative;width:min(78vw,300px);height:auto;animation:fin .8s .2s both}
.arrow{animation:arw 1.4s ease-in infinite}
@keyframes arw{0%{transform:translateX(-34px);opacity:0}20%{opacity:1}100%{transform:translateX(30px);opacity:1}}
.bob{animation:bob 1.1s ease-in-out infinite}
.bob2{animation:bob 1.1s ease-in-out .55s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.shake{animation:shk .16s linear infinite;transform-origin:center}
@keyframes shk{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-5deg)}}
.spark{animation:spk .3s steps(2) infinite;transform-origin:center}
@keyframes spk{0%{opacity:1;transform:scale(1)}100%{opacity:.5;transform:scale(1.35)}}
.pop{animation:pop .7s .5s both}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.18)}100%{transform:scale(1)}}
.slideL{animation:slL 1.1s .3s both}
.slideR{animation:slR 1.1s .3s both}
@keyframes slL{from{transform:translateX(0)}to{transform:translateX(-26px)}}
@keyframes slR{from{transform:translateX(0)}to{transform:translateX(26px)}}
.draw{stroke-dasharray:130;stroke-dashoffset:130;animation:dr 1.6s .4s linear forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.swing{animation:sw 1.6s ease-in-out infinite;transform-origin:120px 28px}
@keyframes sw{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.glow{animation:gl 1.2s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.35}50%{opacity:1}}
</style></head><body><div class="wrap" id="w"><div class="rays"></div><div id="art"></div><div class="t" id="t"></div><div class="sub" id="s"></div></div>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=m=>window.parent.postMessage(Object.assign({isStreamlitMessage:true},m),'*');
// 小人：x 位置、衣服顏色、cls＝動態類別、arms＝'up' 舉高高 / 'bow' 拱手 / 'side'
function man(x,robe,cls,arms){
  const a=arms==='up'?`<path d="M-22 6 L-34 -24M22 6 L34 -24" stroke="${robe}" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-34" cy="-26" r="5.5" fill="#fbe0c8"/><circle cx="34" cy="-26" r="5.5" fill="#fbe0c8"/>`
    :arms==='bow'?`<path d="M-20 8 L-4 2M20 8 L4 2" stroke="${robe}" stroke-width="9" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="7.5" fill="#fbe0c8"/>`
    :`<path d="M-21 6 L-28 20M21 6 L28 20" stroke="${robe}" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-28" cy="21" r="5.5" fill="#fbe0c8"/><circle cx="28" cy="21" r="5.5" fill="#fbe0c8"/>`;
  return `<g transform="translate(${x} 0)"><g class="${cls||''}">
    <path d="M-24 34 Q-20 -2 0 -2 Q20 -2 24 34 Z" fill="${robe}"/>
    <path d="M-9 -2 L0 16 L9 -2" fill="#fbf0dc" opacity=".9"/>${a}
    <ellipse cx="0" cy="-22" rx="18" ry="19" fill="#fbe0c8"/>
    <path d="M-18 -26 Q-14 -44 0 -44 Q14 -44 18 -26 Q8 -34 0 -33 Q-8 -34 -18 -26 Z" fill="#1f1a22"/>
    <circle cx="-7" cy="-21" r="2.6" fill="#2a1a1a"/><circle cx="7" cy="-21" r="2.6" fill="#2a1a1a"/>
    <ellipse cx="-12" cy="-15" rx="4" ry="2.4" fill="#f58f8f" opacity=".6"/>
    <ellipse cx="12" cy="-15" rx="4" ry="2.4" fill="#f58f8f" opacity=".6"/></g></g>`;
}
const sweat='<g class="spark" fill="#7fd0f5"><path d="M-86 -34 q5 8 0 11 q-5 -3 0 -11Z"/><path d="M86 -34 q5 8 0 11 q-5 -3 0 -11Z"/></g>';
const SCENES={
  // 冊封大典：聖旨展開＋金印蓋下
  ennoble:`<svg viewBox="-110 -70 220 130"><g class="pop">
    <rect x="-78" y="-34" width="156" height="64" rx="7" fill="#fbf0dc" stroke="#e3b04b" stroke-width="4"/>
    <rect x="-90" y="-40" width="16" height="76" rx="8" fill="#a3182a"/><rect x="74" y="-40" width="16" height="76" rx="8" fill="#a3182a"/>
    <g stroke="#8a5a3a" stroke-width="4" stroke-linecap="round" opacity=".75">
      <path d="M-56 -18h22M-56 -4h22M-56 10h22M-10 -18h22M-10 -4h22"/></g></g>
    <g class="pop" style="animation-delay:1s"><rect x="18" y="-6" width="40" height="40" rx="5" fill="#c0392b" stroke="#8a1a1a" stroke-width="3"/>
    <text x="38" y="22" font-size="26" font-weight="900" fill="#fff3c4" text-anchor="middle" font-family="serif">旨</text></g></svg>`,
  // 分宮揭曉：宮門往兩側打開，金光射出
  reveal:`<svg viewBox="-110 -70 220 130"><circle cx="0" cy="-4" r="40" fill="#ffe9a8" class="glow"/>
    <g class="slideL"><rect x="-80" y="-48" width="78" height="92" rx="5" fill="#8a1a1a" stroke="#e3b04b" stroke-width="4"/>
      <circle cx="-16" cy="0" r="7" fill="#e3b04b"/><circle cx="-44" cy="-24" r="4" fill="#e3b04b"/><circle cx="-44" cy="24" r="4" fill="#e3b04b"/></g>
    <g class="slideR"><rect x="2" y="-48" width="78" height="92" rx="5" fill="#8a1a1a" stroke="#e3b04b" stroke-width="4"/>
      <circle cx="16" cy="0" r="7" fill="#e3b04b"/><circle cx="44" cy="-24" r="4" fill="#e3b04b"/><circle cx="44" cy="24" r="4" fill="#e3b04b"/></g></svg>`,
  // 填寫名帖：毛筆在名帖上寫字
  card:`<svg viewBox="-110 -70 220 130"><rect x="-62" y="-40" width="124" height="80" rx="8" fill="#fbf0dc" stroke="#e3b04b" stroke-width="4"/>
    <rect x="-52" y="-30" width="34" height="12" rx="4" fill="#c0392b"/>
    <path d="M-50 2h74M-50 18h48" stroke="#8a5a3a" stroke-width="5" stroke-linecap="round" class="draw"/>
    <g class="swing"><rect x="113" y="-62" width="9" height="76" rx="4" fill="#6b4a2a" transform="rotate(32 118 -24)"/>
      <path d="M92 32 l12 -22 l8 5 Z" fill="#2a1a1a"/></g></svg>`,
  // 宮內相認：兩個人互相拱手行禮
  meet:`<svg viewBox="-110 -70 220 130">${man(-44,'#a3182a','bob','bow')}${man(44,'#2f6f6a','bob2','bow')}
    <g class="pop" style="animation-delay:.9s" fill="#ffd36b"><path d="M0 -40 l5 11 12 2 -9 9 2 12 -10 -6 -10 6 2 -12 -9 -9 12 -2Z"/></g></svg>`,
  // 默契大考驗：兩個人頭上冒出一模一樣的燈泡
  s2:`<svg viewBox="-110 -70 220 130">${man(-44,'#a3182a','bob','side')}${man(44,'#4a5d8f','bob2','side')}
    <g class="pop"><circle cx="-44" cy="-56" r="11" fill="#ffe9a8"/><rect x="-48" y="-46" width="8" height="5" rx="2" fill="#8a5a3a"/></g>
    <g class="pop" style="animation-delay:.8s"><circle cx="44" cy="-56" r="11" fill="#ffe9a8"/><rect x="40" y="-46" width="8" height="5" rx="2" fill="#8a5a3a"/></g></svg>`,
  // 傳遞密旨：兩個人手舉高高、神情慌張，中間的炸彈引信在燒
  s3:`<svg viewBox="-110 -72 220 132"><g class="shake"><circle cx="0" cy="4" r="22" fill="#2b2b33"/><ellipse cx="-7" cy="-4" rx="6" ry="4" fill="#5a5a66" opacity=".8"/>
      <rect x="-4" y="-26" width="8" height="10" rx="2" fill="#6b4a2a"/>
      <path d="M0 -26 q10 -8 4 -18" stroke="#8a5a3a" stroke-width="3" fill="none"/>
      <g class="spark"><circle cx="4" cy="-45" r="7" fill="#ffb03a"/><circle cx="4" cy="-45" r="3.5" fill="#fff3c4"/></g></g>
    ${man(-58,'#2f6f6a','bob','up')}${man(58,'#a3182a','bob2','up')}${sweat}</svg>`,
  // 宮廷謎題：卷軸上的問號＋放大鏡
  s4:`<svg viewBox="-110 -70 220 130"><rect x="-60" y="-40" width="120" height="82" rx="8" fill="#fbf0dc" stroke="#e3b04b" stroke-width="4"/>
    <text x="-16" y="26" font-size="62" font-weight="900" fill="#a3182a" text-anchor="middle" font-family="serif" class="bob">？</text>
    <g class="bob2"><circle cx="34" cy="-2" r="22" fill="#cfe8f5" opacity=".55" stroke="#8a5a3a" stroke-width="5"/>
      <rect x="46" y="16" width="9" height="30" rx="4" fill="#6b4a2a" transform="rotate(-40 50 30)"/></g></svg>`,
  // 兵臨城下：左邊旌旗搖動的軍隊，右邊城門，一支箭飛過去
  s5:`<svg viewBox="-110 -70 220 130">
    <g><rect x="28" y="-24" width="70" height="66" rx="3" fill="#8a5a3a" stroke="#e3b04b" stroke-width="3"/>
      <path d="M28 -24 v-12 h10 v12 M48 -24 v-12 h10 v12 M68 -24 v-12 h10 v12 M88 -24 v-12 h10 v12" stroke="#e3b04b" stroke-width="3" fill="#8a5a3a"/>
      <path d="M50 42 v-30 a14 14 0 0 1 28 0 v30Z" fill="#3a1c1c" stroke="#e3b04b" stroke-width="3"/></g>
    <g class="bob"><rect x="-84" y="-44" width="5" height="82" rx="2" fill="#6b4a2a"/>
      <path d="M-79 -44 h38 l-9 12 9 12 h-38Z" fill="#c0392b" stroke="#fff3c4" stroke-width="2"/></g>
    <g class="bob2"><rect x="-52" y="-30" width="5" height="68" rx="2" fill="#6b4a2a"/>
      <path d="M-47 -30 h32 l-8 10 8 10 h-32Z" fill="#a3182a" stroke="#fff3c4" stroke-width="2"/></g>
    <g class="arrow"><path d="M-10 -6 h46" stroke="#6b4a2a" stroke-width="4" stroke-linecap="round"/><path d="M36 -6 l-9 -6 v12Z" fill="#8a1a1a"/>
      <path d="M-10 -6 l-7 -5 M-10 -6 l-7 5" stroke="#e3b04b" stroke-width="3" stroke-linecap="round"/></g></svg>`,
  // 論功行賞：金色卷軸上「賞」字，兩旁煙火
  s6:`<svg viewBox="-110 -70 220 130"><g class="pop"><rect x="-56" y="-38" width="112" height="76" rx="7" fill="#fbf0dc" stroke="#e3b04b" stroke-width="4"/>
    <rect x="-66" y="-44" width="14" height="88" rx="7" fill="#a3182a"/><rect x="52" y="-44" width="14" height="88" rx="7" fill="#a3182a"/>
    <text x="0" y="18" font-size="50" font-weight="900" fill="#a3182a" text-anchor="middle" font-family="serif">賞</text></g>
    <g class="spark" fill="#ffd36b"><circle cx="-86" cy="-40" r="5"/><circle cx="-78" cy="-52" r="3"/><circle cx="-94" cy="-28" r="3"/>
      <circle cx="86" cy="-44" r="5"/><circle cx="96" cy="-30" r="3"/><circle cx="78" cy="-56" r="3"/></g>
    <g class="pop" style="animation-delay:.9s" fill="#ffe9a8"><path d="M-86 30 l4 9 10 1 -8 7 2 10 -8 -5 -8 5 2 -10 -8 -7 10 -1Z"/>
      <path d="M86 30 l4 9 10 1 -8 7 2 10 -8 -5 -8 5 2 -10 -8 -7 10 -1Z"/></g></svg>`,
  // 貢獻分享：金色徽章閃亮
  share:`<svg viewBox="-110 -70 220 130"><g class="pop"><path d="M-22 -40 l-14 34 14 10 Z" fill="#c0392b"/><path d="M22 -40 l14 34 -14 10 Z" fill="#8a1a1a"/>
    <circle cx="0" cy="6" r="34" fill="#e3b04b" stroke="#fff3c4" stroke-width="4"/><circle cx="0" cy="6" r="24" fill="#ffe9a8"/>
    <path d="M0 -12 l6 13 14 2 -10 10 2 14 -12 -7 -12 7 2 -14 -10 -10 14 -2Z" fill="#c0392b"/></g>
    <g class="spark" fill="#fff3c4"><circle cx="-44" cy="-20" r="4"/><circle cx="46" cy="-14" r="5"/><circle cx="30" cy="40" r="3.5"/></g></svg>`,
};
function render(a){
  const el=Number(a.elapsed||0);
  $('art').innerHTML=SCENES[a.scene]||SCENES.s2;
  $('t').textContent=a.title||'';
  $('s').textContent=a.sub||'';
  document.querySelectorAll('.wrap,.t,.sub,svg,.pop,.slideL,.slideR,.draw').forEach(n=>{
    const d=getComputedStyle(n).animationDelay;
    const cur=(d&&d!=='0s')?parseFloat(d):0;
    n.style.animationDelay=(cur-el)+'s';     // 對齊伺服器時間
  });
}
window.addEventListener('message',ev=>{const d=ev.data;if(d&&d.type==='streamlit:render')render(d.args||{})});
post({type:'streamlit:componentReady',apiVersion:1});
</script></body></html>
