<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* 默契大考驗「題目＋選項」合併框。外框樣式與頁面上的 .gcard 相同；選項做成會凸起的按鈕，一看就知道可以點。 */
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:'Noto Serif TC','PMingLiU',serif;color:#3a1c1c;padding:4px 6px 16px}
button{font-family:inherit}
.box{background:#fbf0dc;border:3px solid #e3b04b;border-radius:14px;padding:12px 16px 14px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.hd{text-align:center;font-size:14px;font-weight:900;letter-spacing:.08em;color:#8a5a3a}
.q{margin-top:6px;text-align:center;font-size:21px;font-weight:900;line-height:1.7;color:#3a1c1c}
.hint{margin-top:8px;text-align:center;font-size:16px;line-height:1.7;color:#7a3b2e}
.sep{height:0;border-top:2px dashed #d9b36a;margin:12px 0 2px}
.op{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:10px 14px 10px 10px;text-align:left;cursor:pointer;
 background:linear-gradient(#fffaf0,#fff0d2);border:2px solid #e3b04b;border-radius:12px;box-shadow:0 4px 0 #c99a3a;color:#3a1c1c;transition:transform .08s,box-shadow .08s}
.op:active{transform:translateY(3px);box-shadow:0 1px 0 #c99a3a}
.op.sel{background:#e3b04b}
.op .lt{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-size:21px;font-weight:900;color:#fff3c4;background:radial-gradient(circle at 35% 30%,#c0392b,#8a1a1a);border:2px solid #fff3c4}
.op .nm{flex:1;min-width:0;font-size:19px;font-weight:900;line-height:1.5;word-break:break-all}
.op .go{flex:none;font-size:24px;font-weight:900;color:#b3261e;line-height:1}
.op.mine{border-color:#1a7f37;box-shadow:0 4px 0 #1a7f37;background:linear-gradient(#f2fff4,#e3f7e8)}
.op.mine .lt{background:radial-gradient(circle at 35% 30%,#2fa75a,#1a7f37)}
.op.mine .go{color:#1a7f37;font-size:20px}
</style></head><body><div class="box" id="box"></div>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=m=>window.parent.postMessage(Object.assign({isStreamlitMessage:true},m),'*');
const setH=()=>post({type:'streamlit:setFrameHeight',height:Math.ceil(document.documentElement.getBoundingClientRect().height)+2});
let NSEQ=0,LASTKEY='',LOCK=false,SIG='';
function render(a){
  const key=a.nonce||'';
  if(key!==LASTKEY){LASTKEY=key;LOCK=false}              // 換題：解除鎖定
  const sig=JSON.stringify([key,a.question,a.hint,a.options,a.mine]);
  if(sig===SIG)return;SIG=sig;                            // 內容沒變就不重畫（避免閃動）
  $('box').innerHTML=
    (a.title?`<div class="hd">${esc(a.title)}</div>`:'')+
    `<div class="q">${esc(a.question||'')}</div>`+
    (a.hint?`<div class="hint">${esc(a.hint)}</div>`:'')+
    '<div class="sep"></div>'+
    (a.options||[]).map(o=>{
      const mine=(a.mine!==null&&a.mine!==undefined&&Number(a.mine)===Number(o.id));
      return `<button class="op${mine?' mine':''}" data-id="${esc(o.id)}">`+
        `<span class="lt">${esc(o.letter||'')}</span><span class="nm">${esc(o.name)}</span>`+
        `<span class="go">${mine?'目前答案':'›'}</span></button>`}).join('');
  $('box').querySelectorAll('.op').forEach(b=>b.onclick=()=>{
    if(LOCK)return;LOCK=true;b.classList.add('sel');
    post({type:'streamlit:setComponentValue',value:{n:++NSEQ,type:'pick',id:Number(b.dataset.id)},dataType:'json'});
    setTimeout(()=>{LOCK=false;b.classList.remove('sel')},1200)});   // 若伺服器拒絕（例如時間已過），1.2 秒後可再點
  setH();
}
window.addEventListener('message',ev=>{const d=ev.data;if(d&&d.type==='streamlit:render'){render(d.args||{});setH()}});
if(window.ResizeObserver)new ResizeObserver(setH).observe(document.body);
post({type:'streamlit:componentReady',apiVersion:1});
</script></body></html>
