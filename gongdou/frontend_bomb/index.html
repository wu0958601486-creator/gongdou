<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* 密旨傳遞：宮內人物排成一排，炸彈會快速移動到拿著密旨的人上方；拿到炸彈的人旁邊冒冷汗。 */
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:'Noto Serif TC','PMingLiU',serif;color:#fbf0dc;padding:2px 4px 6px}
.stage{position:relative;padding-top:92px}
.row{display:flex;justify-content:space-around;gap:4px}
.m{position:relative;flex:1;min-width:0;text-align:center;padding:4px 0}
.m img{width:58px;height:58px;border-radius:50%;display:block;margin:0 auto;border:3px solid #e3b04b;background:#fbf0dc;transition:transform .2s}
.m .nm{margin-top:4px;font-size:15px;font-weight:900;color:#7be39a;text-shadow:0 1px 2px rgba(0,0,0,.6);word-break:break-all;line-height:1.3}
.m .you{display:inline-block;margin-left:3px;font-size:11px;background:#b3261e;color:#fff3c4;border-radius:999px;padding:0 6px}
.m.hot img{border-color:#ff5a3c;transform:scale(1.12);animation:nerv .18s linear infinite;box-shadow:0 0 14px rgba(255,90,60,.9)}
@keyframes nerv{0%{margin-left:-2px}50%{margin-left:2px}100%{margin-left:-2px}}
.sweat{position:absolute;top:8px;right:-2px;left:-2px;height:70px;z-index:3;pointer-events:none;display:none}
.m.hot .sweat{display:block}
.sweat i{position:absolute;font-style:normal;font-size:24px;opacity:0;animation:drip 0.9s ease-in infinite}
.sweat i:nth-child(1){left:2%;animation-delay:0s}
.sweat i:nth-child(2){right:2%;animation-delay:.3s}
.sweat i:nth-child(3){right:14%;top:-4px;animation-delay:.6s}
@keyframes drip{0%{transform:translateY(-4px) scale(.7);opacity:0}25%{opacity:1}100%{transform:translateY(34px) scale(1);opacity:0}}
.wow{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:18px;display:none}
.m.hot .wow{display:block;animation:nerv .25s linear infinite}
#bomb{position:absolute;top:0;left:0;width:84px;height:84px;margin-left:-42px;text-align:center;line-height:84px;font-size:64px;
 transition:left .32s cubic-bezier(.2,.9,.3,1.2);will-change:left;pointer-events:none}
#bomb span{display:inline-block;animation:tremble 20s linear forwards}
</style><style id="kf"></style></head><body><div class="stage" id="stage"><div id="bomb"><span>💣</span></div><div class="row" id="row"></div></div>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=m=>window.parent.postMessage(Object.assign({isStreamlitMessage:true},m),'*');
const setH=()=>post({type:'streamlit:setFrameHeight',height:Math.ceil(document.documentElement.getBoundingClientRect().height)+2});
// 炸彈搖晃：20 秒內越晃越快（只看經過時間，不洩漏實際秒數）
(function(){let t=0,i=0,kf=[];while(t<20){const gap=Math.max(.1,1-.9*t/20),ang=4+14*t/20;
 kf.push((t/20*100).toFixed(2)+'%{transform:rotate('+((i%2?ang:-ang).toFixed(1))+'deg)}');t+=gap;i++}
 kf.push('100%{transform:rotate(0)}');$('kf').textContent='@keyframes tremble{'+kf.join('')+'}'})();
let BUILT='',STARTED=false;
function place(holder){
  const m=document.querySelector('.m[data-id="'+holder+'"]');if(!m)return;
  const sr=$('stage').getBoundingClientRect(),r=m.getBoundingClientRect();
  $('bomb').style.left=(r.left-sr.left+r.width/2)+'px';
  document.querySelectorAll('.m').forEach(x=>x.classList.toggle('hot',x===m));
}
function render(a){
  const av=a.avatars||{},ms=a.members||[];
  const sig=JSON.stringify(ms.map(m=>[m.id,m.name,m.role,m.you]));
  if(sig!==BUILT){BUILT=sig;
    $('row').innerHTML=ms.map(m=>`<div class="m" data-id="${m.id}"><div class="sweat"><i>💧</i><i>💧</i><i>💦</i></div><span class="wow">😰</span>`+
      `${av[m.role]?`<img alt="" src="${av[m.role]}">`:''}<div class="nm">${esc(m.name)}${m.you?'<span class="you">你</span>':''}</div></div>`).join('')}
  if(!STARTED){STARTED=true;$('bomb').firstChild.style.animationDelay='-'+(a.elapsed||0)+'s';
    $('bomb').style.transition='none';place(a.holder);void $('bomb').offsetWidth;$('bomb').style.transition=''}
  else place(a.holder);
  setH();
}
window.addEventListener('message',ev=>{const d=ev.data;if(d&&d.type==='streamlit:render'){render(d.args||{})}});
window.addEventListener('resize',()=>{const h=document.querySelector('.m.hot');if(h)place(h.dataset.id)});
post({type:'streamlit:componentReady',apiVersion:1});
</script></body></html>
