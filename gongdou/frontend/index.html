<script>
/* ===== Streamlit 雙向元件橋接層（不改動原本的畫面與動畫，只負責與 Python 溝通） ===== */
let ANS=[],RESUME=[],REM0=0,T0=0,tmrId=null,LASTKEY='',QDONE=false,NSEQ=0;
const post=m=>window.parent.postMessage(Object.assign({isStreamlitMessage:true},m),'*');
const setH=h=>post({type:'streamlit:setFrameHeight',height:h});
const send=v=>post({type:'streamlit:setComponentValue',value:v,dataType:'json'});
function report(done){send({n:++NSEQ,type:'quiz',answers:ANS.slice(),done:!!done})}
function remaining(){return REM0-(Date.now()-T0)/1000}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function ensureTimer(){let t=$('tmr');if(!t){t=document.createElement('div');t.id='tmr';t.style.cssText='font-size:12px;opacity:.85;letter-spacing:.1em;margin-top:2px';$('qz').insertBefore(t,$('qz').firstChild)}return t}
function startTimer(){ensureTimer();clearInterval(tmrId);if(PAUSED)return;tmrId=setInterval(()=>{const r=remaining();ensureTimer().textContent='剩餘時間 '+fmt(r);if(r<=0&&!QDONE)finishQuiz()},250)}
function waitScreen(txt){$('cl').innerHTML=(txt||'史官正在整理名冊……')+'<div class="ink"></div>';show('cl')}

function begin(){qi=0;sc={嬤:0,內:0,妃:0,嬪:0,衛:0};p2={...sc};ANS=[];

/* 暫停：測驗畫面留在原地（不重新載入），只蓋上「暫停中」並凍結倒數；繼續後從原題接著做 */
let PAUSED=false;
function pauseLayer(on){let d=$('pz');if(!d){d=document.createElement('div');d.id='pz';
  d.style.cssText='position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(42,7,8,.86);padding:24px;text-align:center';
  d.innerHTML='<div style="background:var(--cream);color:#3a1c1c;border:3px solid var(--gold);border-radius:14px;padding:18px 22px;font-size:20px;font-weight:900;line-height:1.7">遊戲暫停中<br><span style="font-size:15px;font-weight:700">請稍候，房主繼續後會回到原本的題目</span></div>';
  document.querySelector('.app').appendChild(d)}
  d.style.display=on?'flex':'none'}
function syncPause(a){const p=!!a.paused;if(p===PAUSED)return;PAUSED=p;
  if(p){if(typeof a.rem==='number')REM0=a.rem;else REM0=remaining();T0=Date.now();clearInterval(tmrId);
    if(!QDONE)ensureTimer().textContent='剩餘時間 '+fmt(REM0);pauseLayer(true)}
  else{pauseLayer(false);if(typeof a.rem==='number')REM0=a.rem;T0=Date.now();
    if(!QDONE){startTimer();if(ANS.length)report(false)}}}
function onRender(a){
  const key=a.mode+'|'+(a.nonce||'');
  if(key===LASTKEY){if(a.mode==='quiz')syncPause(a);return}LASTKEY=key;clr();clearInterval(tmrId);PAUSED=false;pauseLayer(false);
  if(a.mode==='home'){setH(a.height||600);const b=document.querySelector('#hm .btn');if(b)b.style.display='none';show('hm')}
  else if(a.mode==='quiz'){setH(a.height||780);Q=a.questions;REM0=a.rem;T0=Date.now();RESUME=a.answers||[];QDONE=false;NSEQ=0;
    startTimer();

</script>
